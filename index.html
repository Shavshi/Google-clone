<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Clone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      padding: 20px;
      gap: 15px;
    }

    header a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 80px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .logo span:nth-child(1){ color:#4285F4; }
    .logo span:nth-child(2){ color:#DB4437; }
    .logo span:nth-child(3){ color:#F4B400; }
    .logo span:nth-child(4){ color:#4285F4; }
    .logo span:nth-child(5){ color:#0F9D58; }
    .logo span:nth-child(6){ color:#DB4437; }

    input {
      width: 500px;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 16px;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      background: #f2f2f2;
      cursor: pointer;
    }

    button:hover {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<header>
  <a href="#">Gmail</a>
  <a href="#">Images</a>
</header>

<div class="container">
  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <input type="text" placeholder="Search Google">

  <div class="buttons">
    <button>Google Search</button>
    <button>I'm Feeling Lucky</button>
  </div>
</div>

</body>
</html>
